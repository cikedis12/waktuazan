<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Waktu Azan Shah Alam</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #004aad, #ffd700);
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: white;
}

#container {
    width: 100%;
    height: 100%;
    text-align: center;
    position: relative;

    display: flex;
    flex-direction: column;
    align-items: center;
}

#logo {
    margin-top: 40px;
    width: 25%;
    max-width: 220px;
    min-width: 120px;
    animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
    0% {
        opacity: 1;
        transform: scale(1);
    }
    50% {
        opacity: 0.8;
        transform: scale(1.08);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

h1 {
    margin: 20px 0;
    font-size: 4vw;
    text-shadow: 3px 3px 8px #000;
}

#clock {
    font-size: 11vw;
    font-weight: bold;
    margin-top: 30px;
    text-shadow: 0 0 15px #ffd700;
}

#nextAzan {
    font-size: 3vw;
    margin-top: 20px;
    font-weight: 600;
}

#countdown {
    margin-top: 30px;
    width: 80%;
    max-width: 650px;
    padding: 20px;
    font-size: 8vw;
    font-weight: bold;
    border-radius: 25px;
    background: rgba(0, 0, 128, 0.75);
    box-shadow: 0 0 25px #ffd700;
}

#footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    font-size: 1.2vw;
    text-shadow: 1px 1px 3px #000;
}

@media (max-width: 900px) {
    h1 {
        font-size: 6vw;
    }

    #nextAzan {
        font-size: 5vw;
    }

    #footer {
        font-size: 3vw;
    }
}
</style>

<script>
var azanTimes = [
    {name:'Fajr', time:'05:53'},
    {name:'Dhuhr', time:'13:12'},
    {name:'Asr', time:'16:58'},
    {name:'Maghrib', time:'19:20'},
    {name:'Isha', time:'20:32'}
];

function parseTimeToDate(hhmm) {
    var now = new Date();
    var parts = hhmm.split(':');

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        parseInt(parts[0],10),
        parseInt(parts[1],10),
        0
    );
}

function getNextAzan() {
    var now = new Date();

    for (var i=0; i<azanTimes.length; i++) {
        var azanDate = parseTimeToDate(azanTimes[i].time);

        if (azanDate > now) {
            return {
                name: azanTimes[i].name,
                time: azanTimes[i].time,
                date: azanDate
            };
        }
    }

    var tomorrowFajr = parseTimeToDate(azanTimes[0].time);
    tomorrowFajr.setDate(tomorrowFajr.getDate() + 1);

    return {
        name: azanTimes[0].name,
        time: azanTimes[0].time,
        date: tomorrowFajr
    };
}

function pad(n) {
    return (n < 10) ? "0" + n : n;
}

function formatTime(sec) {
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;

    return pad(h) + ":" + pad(m) + ":" + pad(s);
}

function updateClock() {

    var now = new Date();

    document.getElementById("clock").innerHTML =
        pad(now.getHours()) + ":" +
        pad(now.getMinutes()) + ":" +
        pad(now.getSeconds());

    var nextAzan = getNextAzan();

    document.getElementById("nextAzan").innerHTML =
        "Next Azan : " +
        nextAzan.name +
        " (" +
        nextAzan.time +
        ")";

    var diff =
        Math.floor((nextAzan.date - now) / 1000);

    if (diff < 0) diff = 0;

    document.getElementById("countdown").innerHTML =
        formatTime(diff);

    setTimeout(updateClock, 1000);
}
</script>

</head>

<body onload="updateClock()">

<div id="container">

    <img
        id="logo"
        src="https://upload.wikimedia.org/wikipedia/en/2/2d/SIRIM_Logo.png"
        alt="Logo">

    <h1>WAKTU AZAN SHAH ALAM</h1>

    <div id="clock">--:--:--</div>

    <div id="nextAzan">
        Next Azan
    </div>

    <div id="countdown">
        --:--:--
    </div>

    <div id="footer">
        Digital Signage • Shah Alam
    </div>

</div>

</body>
</html>
